name: release

# 计划书 §7.3：云端打包发布（语义化版本规范见 docs/VERSIONING.md）
# 两条触发路径：
#   1. push tag v*        → 正式版（stable）：以 tag 版本为准
#   2. workflow_dispatch  → stable：以 pubspec.yaml 当前版本发布；beta：当前版本 + -beta.N
# 版本号规则：严格语义化 X.Y.Z（0..9 每位，上限 9.9.9），pubspec.yaml 为唯一版本源。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: '发布通道'
        type: choice
        options: [stable, beta]
        default: beta

defaults:
  run:
    shell: bash

jobs:
  # 统一解析版本号与通道，供所有构建任务共用
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      channel: ${{ steps.ver.outputs.channel }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        env:
          EVENT: ${{ github.event_name }}
          CH: ${{ inputs.channel }}
        run: |
          set -e
          # pubspec.yaml 中的语义化版本（唯一版本源）
          V=$(grep -E '^version:' pubspec.yaml | sed 's/version: *//; s/[^0-9.].*//')
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::pubspec.yaml 版本号必须是 X.Y.Z 语义化格式，当前为：$V"
            exit 1
          fi
          # 上限 9.9.9 校验
          if [ "$(echo "$V" | awk -F. '{print ($1>9)||($2>9)||($3>9)}')" = "1" ]; then
            echo "::error::版本号 $V 超出上限 9.9.9"
            exit 1
          fi
          if [ "$EVENT" = "push" ]; then
            # tag 触发：tag 版本必须与 pubspec 一致（保证可追溯）
            TAG_V="${GITHUB_REF_NAME#v}"
            if [ "$TAG_V" != "$V" ]; then
              echo "::error::tag 版本（$TAG_V）与 pubspec.yaml 版本（$V）不一致，请对齐后再发布"
              exit 1
            fi
            echo "version=$V" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [ "$CH" = "stable" ]; then
            echo "version=$V" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=${V}-beta.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

  build-android:
    needs: meta
    runs-on: ubuntu-latest
    # secrets 上下文不能用于 if: 条件，经由 job 级 env 中转
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6 # 与 ci.yml 保持一致
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: 还原签名密钥（Secrets 缺失时回退 debug 签名）
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/app/literead-release.jks
          {
            echo "storeFile=literead-release.jks"
            echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > android/key.properties
      # 版本号以 meta 解析结果为准（覆盖 pubspec），build-number 用流水线序号保证单调
      # 仅构建 arm64/arm32：发布产物只含 v8a/v7a（省去 AAB 与 x86_64 的构建时间）
      - run: >-
          flutter build apk --release --split-per-abi
          --target-platform android-arm,android-arm64
          --build-name=${{ needs.meta.outputs.version }}
          --build-number=${{ github.run_number }}
      - name: 重命名产物（带版本号）
        run: |
          VERSION=${{ needs.meta.outputs.version }}
          cd build/app/outputs/flutter-apk
          mkdir -p /tmp/dist
          for f in app-*-release.apk; do
            mv "$f" "LiteRead-${VERSION}-$(echo "$f" | sed 's/^app-//;s/-release\.apk$//').apk"
          done
          cp ./*.apk /tmp/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: android-out
          path: /tmp/dist/*

  build-windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - run: flutter test
      # release 构建：避免 debug CRT 依赖导致用户机器上「双击打不开」
      - run: >-
          flutter build windows --release
          --build-name=${{ needs.meta.outputs.version }}
          --build-number=${{ github.run_number }}
      # 工件直接上传 Release 目录内容（扁平）：
      # 从 Actions 下载工件时解压即得应用文件，不再出现 zip 套 zip；
      # 最终发布 zip 由 release 任务统一打包。
      - uses: actions/upload-artifact@v4
        with:
          name: windows-out
          path: build/windows/x64/runner/Release/*

  release:
    needs: [meta, build-android, build-windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      # 完整历史（含 tags）：用于生成「上个版本以来」的更新日志
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: 打包 Windows 便携 zip（扁平结构：解压直接呈现应用文件）
        run: |
          VERSION=${{ needs.meta.outputs.version }}
          mkdir -p dist/release
          cd dist/windows-out
          zip -qr "../../dist/release/LiteRead-${VERSION}-windows-x64.zip" .
          cd ../..
      - name: 汇总产物
        run: cp dist/android-out/* dist/release/
      - name: 构建 Release 说明（仅编号式更新日志）
        run: |
          {
            # 更新日志：上个 tag 到当前提交的提交摘要，以「1. 2. …」编号列出；
            # 跳过 chore 提交（版本号 bump），去掉 type 前缀（如 feat:）
            PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null \
              || git describe --tags --abbrev=0 HEAD 2>/dev/null || true)
            if [ -n "$PREV" ]; then
              git log --pretty=format:'%s' "$PREV..HEAD" \
                | grep -v '^chore' \
                | sed 's/^[a-zA-Z][a-zA-Z]*\(([^)]*)\)\{0,1\}: *//; s/^v[0-9][0-9.]*—— *//' \
                | awk '{printf "%d. %s\n", NR, $0}'
            else
              git log --pretty=format:'%s' -8 \
                | grep -v '^chore' \
                | sed 's/^[a-zA-Z][a-zA-Z]*\(([^)]*)\)\{0,1\}: *//; s/^v[0-9][0-9.]*—— *//' \
                | awk '{printf "%d. %s\n", NR, $0}'
            fi
          } > release-body.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          name: v${{ needs.meta.outputs.version }}
          files: dist/release/**
          prerelease: ${{ needs.meta.outputs.prerelease }}
          body_path: release-body.md
          generate_release_notes: false

  # 发布成功通知（t15）：Release 成功发出后标记任务完成。
  # - 写入 Workflow Summary（Actions 页可见）
  # - 若配置了 secrets.NOTIFY_WEBHOOK（JSON POST，如企业微信/钉钉/飞书机器人），
  #   同时推送通知；未配置则跳过。
  notify:
    needs: [meta, release]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.release.result == 'success' }}
    env:
      WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
    steps:
      - name: 发布成功通知
        run: |
          {
            echo "## ✅ LiteRead v${{ needs.meta.outputs.version }} 发布成功"
            echo ""
            echo "- 通道：${{ needs.meta.outputs.channel }}"
            echo "- 链接：https://github.com/${{ github.repository }}/releases/tag/v${{ needs.meta.outputs.version }}"
            echo "- 时间：$(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$WEBHOOK" ]; then
            curl -fsSL -X POST \
              -H 'Content-Type: application/json' \
              -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"LiteRead v${{ needs.meta.outputs.version }} 发布成功（${{ needs.meta.outputs.channel }}）https://github.com/${{ github.repository }}/releases/tag/v${{ needs.meta.outputs.version }}\"}}" \
              "$WEBHOOK" || echo "::warning::通知 Webhook 调用失败（不影响发布结果）"
          else
            echo "未配置 NOTIFY_WEBHOOK，仅写入 Summary。"
          fi
