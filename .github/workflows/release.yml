name: release

# 计划书 §7.3：云端打包发布
# 两条触发路径：
#   1. push tag v*        → 正式版（stable）：Android 签名 APK/AAB + Windows 便携包 → GitHub Release
#   2. workflow_dispatch  → 可选 stable / beta 通道；beta 以 prerelease 形式发布
#                          （版本号取 pubspec.yaml，beta 自动追加 -beta.N）
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: '发布通道'
        type: choice
        options: [stable, beta]
        default: beta

defaults:
  run:
    shell: bash

jobs:
  # 统一解析版本号与通道，供所有构建任务共用
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      channel: ${{ steps.ver.outputs.channel }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          BASE=$(grep '^version:' pubspec.yaml | sed 's/version: \([0-9.]*\)+.*/\1/')
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            # tag 触发：优先用 tag 名
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ inputs.channel }}" == "stable" ]]; then
            echo "version=$BASE" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=${BASE}-beta.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

  build-android:
    needs: meta
    runs-on: ubuntu-latest
    # secrets 上下文不能用于 if: 条件，经由 job 级 env 中转
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6 # 与 ci.yml 保持一致
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: 还原签名密钥（Secrets 缺失时回退 debug 签名）
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/app/literead-release.jks
          {
            echo "storeFile=literead-release.jks"
            echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > android/key.properties
      - run: flutter build apk --release --split-per-abi
      - run: flutter build appbundle --release
      - name: 重命名产物（带版本号）
        run: |
          VERSION=${{ needs.meta.outputs.version }}
          cd build/app/outputs/flutter-apk
          mkdir -p /tmp/dist
          for f in app-*-release.apk; do
            mv "$f" "LiteRead-${VERSION}-$(echo "$f" | sed 's/^app-//;s/-release\.apk$//').apk"
          done
          cp ./*.apk /tmp/dist/
          cp ../bundle/release/*.aab "/tmp/dist/LiteRead-${VERSION}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android-out
          path: /tmp/dist/*

  build-windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - run: flutter test
      # release 构建：避免 debug CRT 依赖导致用户机器上「双击打不开」
      - run: flutter build windows --release
      - name: 打包便携 zip
        shell: pwsh
        run: |
          $version = "${{ needs.meta.outputs.version }}"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "LiteRead-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-out
          path: LiteRead-*.zip

  release:
    needs: [meta, build-android, build-windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: 生成校验和
        run: cd dist && find . -type f -exec sha256sum {} \; > SHA256SUMS.txt
      - name: 构建 Release 说明
        run: |
          {
            echo "## 轻阅 LiteRead ${{ needs.meta.outputs.version }}"
            echo ""
            if [[ "${{ needs.meta.outputs.channel }}" == "beta" ]]; then
              echo "> ⚠️ **测试版（beta）**：功能可能不稳定，仅供尝鲜与反馈。"
              echo ""
            fi
            echo "### 下载指引"
            echo "- **Android**：\`LiteRead-<版本>-arm64-v8a.apk\`（绝大多数现代手机）/ \`armeabi-v7a.apk\`（老设备）"
            echo "- **Windows**：\`LiteRead-<版本>-windows-x64.zip\`，解压后运行 \`literead.exe\`（免安装便携版）"
            echo "- 完整性校验见 \`SHA256SUMS.txt\`"
            echo ""
            echo "> Windows SmartScreen 可能对未签名程序弹窗，点击「仍要运行」即可（计划书 R4）。"
          } > release-body.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          files: dist/**
          prerelease: ${{ needs.meta.outputs.prerelease }}
          body_path: release-body.md
          generate_release_notes: true
