name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6 # 与本地开发版本一致（riverpod_lint legacy plugin 在新 SDK 触发弃用告警）
          cache: true
      - run: flutter pub get
      - name: Format check
        run: dart format --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - name: Debug 冒烟构建（M0 门禁：双平台 debug 包可安装）
        run: flutter build apk --debug

  build-windows:
    runs-on: windows-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - name: Release 冒烟构建
        # 不再上传 debug 包：debug 构建依赖 Debug CRT（vcruntime140d.dll），
        # 无 VS 环境的用户机器上双击无响应（曾导致「程序打不开」反馈）
        run: flutter build windows --release
      - name: 打包便携 zip
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath LiteRead-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: LiteRead-windows-x64.zip
          retention-days: 7

# release.yml：tag v* 驱动签名 APK/AAB + Windows 便携包 → GitHub Release（已接入，见 .github/workflows/release.yml）
