name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format check
        run: dart format --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Debug 冒烟构建（M0 门禁：双平台 debug 包可安装）
        run: flutter build apk --debug

  build-windows:
    runs-on: windows-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Debug 冒烟构建
        run: flutter build windows --debug
      - uses: actions/upload-artifact@v4
        with:
          name: windows-debug
          path: build/windows/x64/runner/Debug/
          retention-days: 7

  # release.yml：tag 驱动的签名 APK/AAB + MSIX/Inno 安装器发布（M4 接入，见计划书 §7.3）
