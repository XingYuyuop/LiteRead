name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6 # 与本地开发版本一致（riverpod_lint legacy plugin 在新 SDK 触发弃用告警）
          cache: true
      - run: flutter pub get
      - name: Format check
        run: dart format --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - name: Debug 冒烟构建（M0 门禁：双平台 debug 包可安装）
        run: flutter build apk --debug

  build-windows:
    runs-on: windows-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - name: Release 冒烟构建
        # 不再上传 debug 包：debug 构建依赖 Debug CRT（vcruntime140d.dll），
        # 无 VS 环境的用户机器上双击无响应（曾导致「程序打不开」反馈）
        run: flutter build windows --release
      - name: 打包便携 zip
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath LiteRead-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: LiteRead-windows-x64.zip
          retention-days: 7

  # 版本号自动递增（语义化版本规范，见 docs/VERSIONING.md）：
  # 主干测试通过后 patch +1（1.0.1 → 1.0.2 … 1.0.9 → 1.1.0），上限 9.9.9。
  # 提交信息带 [skip ci] 防止触发新一轮流水线造成循环。
  bump-version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-test
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: patch 版本 +1 并提交
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          V=$(grep -E '^version:' pubspec.yaml | sed 's/version: *//; s/[^0-9.].*//')
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::pubspec.yaml 版本号必须是 X.Y.Z 语义化格式，当前为：$V"
            exit 1
          fi
          NEXT=$(echo "$V" | awk -F. '{
            z = $3 + 1; y = $2; x = $1;
            if (z > 9) { z = 0; y++ }
            if (y > 9) { y = 0; x++ }
            if (x > 9) { print "MAXED"; exit }
            printf "%d.%d.%d", x, y, z
          }')
          if [ "$NEXT" = "MAXED" ]; then
            echo "::error::版本已达上限 9.9.9，请人工评估后重置版本号"
            exit 1
          fi
          sed -i "s/^version: .*/version: $NEXT+${GITHUB_RUN_NUMBER}/" pubspec.yaml
          git add pubspec.yaml
          git commit -m "chore(version): bump to v$NEXT [skip ci]"
          git push

# release.yml：tag v* / 手动触发签名构建并发布 GitHub Release（见 .github/workflows/release.yml）
# 版本规范：X.Y.Z 语义化版本，pubspec.yaml 为唯一版本源，上限 9.9.9（docs/VERSIONING.md）
